# Hermes Agent 設定。`../hermes` を `/opt/data` に bind mount + config.yaml
# だけ :ro override しているので、Hermes はこのファイルを rewrite できない
# (#52)。設定変更したい時はホスト側でこのファイルを編集 + コンテナ再起動。
# schema は公式 cli-config.yaml.example に準拠。

model:
  # OpenCode Go 内のモデル。実モデル一覧は
  # https://opencode.ai/zen/go/v1/models で確認。
  default: "deepseek-v4-flash"
  # plugin-registered provider 名(canonical)を直接指定。
  provider: "opencode-go"

web:
  search_backend: "searxng"
  extract_backend: "firecrawl"

agent:
  # cron 経由 subagent では危険な toolset を完全に無効化する。
  # `approvals.cron_mode: deny` (Hermes default) で terminal の approval
  # request が永遠に詰まるため、agent に呼ばせない方が安全。
  # 我々の skill は MCP minakata.* と web しか必要としない。
  disabled_toolsets:
    - terminal
    - code_execution
    - file

mcp_servers:
  # Minakata MCP サーバー(Streamable HTTP, Bearer 認証)。
  # ${MCP_TOKEN} は hermes コンテナの environment 経由で展開される。
  #
  # Capability 分離(#208)の現状: このエントリは Hermes インスタンス全体で
  # 単一で、全 subagent が同じ ${MCP_TOKEN} を共有する = MCP 側では未制限
  # (全ツール許可)。Minakata 側には per-agent token(MCP_TOKEN_<AGENT>)で
  # allowlist を効かせる受け口を実装済み(packages/mcp/src/tools.ts の
  # CAPABILITIES)。これを実際に効かせるには subagent ごとに別トークンを
  # 送る必要があり、OpenCode が per-agent の mcp_servers 設定をサポートする
  # か、subagent 別エントリ + tool 制限が必要。対応を確認の上で段階導入する。
  minakata:
    url: "http://minakata:3000/mcp"
    headers:
      Authorization: "Bearer ${MCP_TOKEN}"
