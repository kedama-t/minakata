# Hermes Agent 設定 (/opt/data/config.yaml に :ro でマウントされる)
# 公式 cli-config.yaml.example
# (https://github.com/NousResearch/hermes-agent/blob/main/cli-config.yaml.example)
# の schema に合わせている。

model:
  # OpenCode Go 内の汎用 OSS coding model。実モデル一覧は
  # https://opencode.ai/zen/go/v1/models で確認。
  default: "opencode-go/glm-5.1"
  # `auto` だと cron スケジューラの実行コンテキストで plugin-registered
  # provider (opencode-go) を見つけそびれて "No inference provider
  # configured" になることがあるので、ここでは canonical 名で固定する(#50)。
  provider: "opencode-go"

mcp_servers:
  # Minakata MCP サーバー(Streamable HTTP, Bearer 認証)
  minakata:
    url: "http://minakata:3000/mcp"
    headers:
      Authorization: "Bearer ${MCP_TOKEN}"

skills:
  # 当初は external_dirs で /opt/hermes-minakata-skills を read-only 公開して
  # いたが、cron scheduler の skill_view がそこから skill を解決できない症状
  # があったため、hermes/cron-bootstrap.sh で SKILLS_DIR (/opt/data/skills)
  # に直接コピーする方式に変更した(#50)。external_dirs と SKILLS_DIR 両方に
  # 同じ skill を置くと skill_view がコリジョンで ambiguity error を出すので、
  # ここでは external_dirs を設定しない。host で skill を編集したら次の
  # `bun run compose:up:agent` 起動時に bootstrap script が同期する。
