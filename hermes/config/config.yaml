# Hermes Agent 設定
# tech-stack.md §5.4, §5.5, §5.6 を参照
# 詳細な subagent 定義は M1 で hermes/skills/ 配下に追加する

providers:
  openai:
    # OpenCode Go (https://opencode.ai/docs/go/) を OpenAI 互換として登録。
    # 同じ API キーで Zen (`/zen/v1`) も叩けるが、本プロジェクトは Go 一本化。
    api_base: "${OPENAI_API_BASE}"
    api_key: "${OPENAI_API_KEY}"

mcp:
  minakata:
    url: "${MINAKATA_MCP_URL}"
    token: "${MINAKATA_MCP_TOKEN}"

web:
  search_backend: "searxng"
  searxng_url: "http://searxng:8080"
  extract_backend: "firecrawl"
  # FIRECRAWL_API_KEY は環境変数で渡す

# subagent は hermes/skills/<name>/SKILL.md (agentskills.io 標準) として配置
# Hermes 側は skills_dir で自動検出する
skills_dir: "/root/.hermes/skills"

# tech-stack.md §5.5: タスク種別ごとのモデル切替。
# OpenCode Go は OSS coding model のみを提供するため、ロールごとに別モデルを当てる。
# 実際の提供モデル一覧は `https://opencode.ai/zen/go/v1/models` で確認できる。
default_models:
  small: "opencode-go/deepseek-v4-flash"  # 対話 / ディスパッチ / 軽量判定向け(低レイテンシ)
  research: "opencode-go/glm-5.1"         # 調査・要約・記事化向け(汎用)
  premium: "opencode-go/kimi-k2.6"        # 重要記事の最終仕上げ向け(Go 内の高品質枠)
