# `bun run compose:up` で起動する想定。詳細は README.md / tech-stack.md §5.9
name: minakata

services:
  minakata:
    build:
      context: ..
      dockerfile: docker/Dockerfile.minakata
    image: minakata:dev
    networks:
      default:
        # 固定 IP。OOM 等で minakata だけ再起動しても IP が変わらず、
        # Hermes 側の MCP クライアントが再接続できる(IP 変化時は永久に
        # unreachable になる Hermes gateway の挙動への緩和策)。
        ipv4_address: 10.89.0.100
    ports:
      - "${MINAKATA_BIND:-127.0.0.1}:3000:3000"
    volumes:
      - ../data:/app/data
      - ../models:/app/.cache/huggingface
      # backup_agent が runtime skills を取り込むための read-only マウント。
      # hermes/skills は HERMES_UID 所有なので、別 UID の minakata から読めない
      # 場合は BackupService が warn-skip する(運用で UID / パーミッション調整)。
      - ../hermes/skills:/app/runtime-skills:ro
    environment:
      MCP_TOKEN: "${MCP_TOKEN}"
      # per-agent token による Capability 分離(#208)。設定すると reviser
      # トークンで来た MCP リクエストが reviser の allowlist に絞られる。
      # 未設定なら全 subagent が MCP_TOKEN 共有(未制限)。詳細は .env.example。
      MCP_TOKEN_REVISER: "${MCP_TOKEN_REVISER:-}"
      DATABASE_URL: "file:/app/data/minakata.db"
      ARTICLES_ROOT: "/app/data/articles"
      DOCUMENTS_ROOT: "/app/data/documents"
      HF_HOME: "/app/.cache/huggingface"
      PORT: "3000"
      TIMEZONE: "${TIMEZONE:-Asia/Tokyo}"
      # MCP の DNS rebinding 対策。本番では Hermes コンテナの hostname と Caddy 経由の公開ホストを指定
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-minakata:3000,localhost,localhost:3000}"
      # /v1/scrape の Bearer 認証。Hermes が送る FIRECRAWL_API_KEY と同じ値で検証する
      FIRECRAWL_API_KEY: "${FIRECRAWL_API_KEY}"
      SNAPSHOT_DIR: "/app/data/snapshots"
      # 定期バックアップ(backup_agent → minakata.backup)。BACKUP_DIR を明示
      # しないとコード既定の相対パス ./data/backup が cwd(/app/packages/web)
      # 基準になり EACCES になる。マウント済みで chown された /app/data 配下を指す。
      BACKUP_DIR: "/app/data/backup"
      BACKUP_GIT_REMOTE: "${BACKUP_GIT_REMOTE:-}"
      BACKUP_GIT_TOKEN: "${BACKUP_GIT_TOKEN:-}"
      RUNTIME_SKILLS_DIR: "/app/runtime-skills"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  hermes:
    # 公式 image (Docker Hub: nousresearch/hermes-agent)。`:main` で固定。
    # `bun run compose:up:agent` (--profile agent) で起動する。
    image: nousresearch/hermes-agent:main
    profiles: ["agent"]
    # default の CMD は bare `hermes`(TUI)。container には TTY が無いので
    # first-run 検出で sys.exit(1) → s6 が無限再起動する。`gateway run` は
    # headless 長期稼働モードで cron スケジューラもこの上で動く。
    command: ["gateway", "run"]
    # 公式 Docker docs (https://hermes-agent.nousresearch.com/docs/user-guide/docker)
    # 通り、$HERMES_HOME (/opt/data) 丸ごとを host の hermes/ に bind mount する。
    # これで /opt/data 配下が host から見える = config.yaml / skills / cron /
    # sessions / logs などすべて hermes/ に一元化される。生成物は
    # hermes/.gitignore で除外済み(#52)。
    volumes:
      - ../hermes:/opt/data
      # config.yaml だけ :ro で override する。これで Hermes が起動時に
      # defaults を展開して config.yaml を再書き込みしようとしても block
      # され、host 側 hermes/config.yaml が我々の canonical な minimal
      # 設定のまま維持できる(git status が汚れない、#52)。
      - ../hermes/config.yaml:/opt/data/config.yaml:ro
      # skill の初期状態の正本(git 管理)を :ro で届ける。cron-bootstrap.sh
      # が起動時に /opt/data/skills/ へ seed する。Hermes は実行時コピーを
      # curator で自律編集できるが、正本は read-only なので git は汚れない
      # (seed-on-init、#187)。
      - ../hermes-skills:/opt/minakata-skills:ro
      # cron job の登録は cont-init.d hook で自動化。本体 (main-hermes)
      # 起動前に s6 init が走らせるので、別コンテナ・別プロセスを増やさず済む。
      - ../hermes/cron-bootstrap.sh:/etc/cont-init.d/99-minakata-cron:ro
      # 上流 main-wrapper.sh は #!/bin/sh で container env を読まないため、
      # gateway が HERMES_HOME=/opt/data を受け取れず /opt/data/.hermes に
      # フォールバックする。with-contenv シバン版で上書きして CLI と gateway
      # の HERMES_HOME を一致させる。
      - ../hermes/main-wrapper.sh:/opt/hermes/docker/main-wrapper.sh:ro
    environment:
      # podman rootless では UID マッピングを揃えないと /opt/data の chown
      # が無視され、後段で PermissionError になる(#42)。ホスト側で
      # `HERMES_UID=$(id -u)` / `HERMES_GID=$(id -g)` を .env に書く。
      HERMES_UID: "${HERMES_UID:-10000}"
      HERMES_GID: "${HERMES_GID:-10000}"
      # 1 のとき cron-bootstrap.sh が実行時 skill を git 初期状態へ強制上書き
      # する(#187)。既定(空)は「無い skill だけ seed」で進化版を維持。
      MINAKATA_SKILLS_RESET: "${MINAKATA_SKILLS_RESET:-}"
      # OpenCode Go provider。base_url は plugin で hardcode、env 名も
      # 専用の OPENCODE_GO_API_KEY を使う(汎用 OPENAI_API_KEY ではない)。
      OPENCODE_GO_API_KEY: "${OPENCODE_API_KEY}"
      FIRECRAWL_API_KEY: "${FIRECRAWL_API_KEY}"
      # Firecrawl の scrape/search を Minakata の互換エンドポイントに転送する
      # .env に FIRECRAWL_BASE_URL を書けば上書きできる
      FIRECRAWL_BASE_URL: "${FIRECRAWL_BASE_URL:-http://minakata:3000}"
      # config.yaml の mcp_servers.minakata.headers が ${MCP_TOKEN} を展開
      # できるよう env として渡す。
      MCP_TOKEN: "${MCP_TOKEN}"
      # SearXNG エンドポイント。同一 Docker ネットワーク内の固定 URL。
      SEARXNG_URL: "${SEARXNG_URL:-http://searxng:8080}"
      # コンテナの OS タイムゾーンを設定。cron スケジュールや Python の
      # datetime.now() が正しいローカル時刻を返すようになる。
      TZ: "${TIMEZONE:-Asia/Tokyo}"
    depends_on:
      minakata:
        condition: service_healthy
      searxng:
        condition: service_started
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ../searxng:/etc/searxng
    environment:
      INSTANCE_NAME: "minakata-search"
      SEARXNG_SECRET: "${SEARXNG_SECRET}"
    # Hermes コンテナからのみ docker network 経由でアクセスする想定
    expose:
      - "8080"
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        # 既存の minakata_default と同じサブネットを明示(ipv4_address 指定に必要)
        - subnet: 10.89.0.0/24
          gateway: 10.89.0.1
