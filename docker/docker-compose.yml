# `docker compose -f docker/docker-compose.yml up -d` で起動する想定
# tech-stack.md §5.9 を参照
name: minakata

services:
  minakata:
    build:
      context: ..
      dockerfile: docker/Dockerfile.minakata
    image: minakata:dev
    ports:
      - "3000:3000"
    volumes:
      - ../data:/app/data
      - ../models:/app/.cache/huggingface
    environment:
      MCP_TOKEN: "${MCP_TOKEN}"
      DATABASE_URL: "file:/app/data/minakata.db"
      ARTICLES_ROOT: "/app/data/articles"
      HF_HOME: "/app/.cache/huggingface"
      PORT: "3000"
      # MCP の DNS rebinding 対策。本番では Hermes コンテナの hostname と Caddy 経由の公開ホストを指定
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-minakata,localhost,localhost:3000}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  hermes:
    # 公式イメージ(Docker Hub: nousresearch/hermes-agent)。`:main` で固定。
    # minakata 単体は agent 無しでも UI 起動する(MCP は手動 enqueue/curl で叩ける)。
    image: nousresearch/hermes-agent:main
    profiles: ["agent"]
    # default の CMD は bare `hermes`(TUI)で、container には TTY が無いので
    # 必ず first-run 検出に引っかかって sys.exit(1) → s6 が無限再起動する。
    # `gateway run` は headless 長期稼働モード(first-run check 無し)で、
    # cron スケジューラもこの上で動かす想定(#44)。
    command: ["gateway", "run"]
    volumes:
      # /opt/data は Hermes が runtime state (cron/jobs.json, sessions, logs,
      # memories, ...) を書き込む dir。hermes-cron-init と共有して同じ
      # jobs.json に書けるよう named volume にする(以前は anonymous)。
      # 既存 anonymous volume からの移行は `podman volume prune` で消してから
      # 起動。詳細は README.md 参照(#46)。
      - hermes-data:/opt/data
      # 私たちの custom config と skills を Hermes に届ける(#44)。
      # - config.yaml は read-only bind mount で declarative の単一情報源に
      # - skills は external_dirs 経由で読ませる(/opt/data/skills/ にぶつけて
      #   Hermes 内蔵 skills と混ざるのを避ける)
      - ../hermes/config.yaml:/opt/data/config.yaml:ro
      - ../hermes/skills:/opt/hermes-minakata-skills:ro
    environment:
      # podman rootless では UID マッピングを揃えないと chown が無視され、
      # その後の skills_sync.py で PermissionError になる(#42)。
      # ホスト側で `HERMES_UID=$(id -u) HERMES_GID=$(id -g)` を .env に書く。
      HERMES_UID: "${HERMES_UID:-10000}"
      HERMES_GID: "${HERMES_GID:-10000}"
      # OpenCode Go (https://opencode.ai/docs/go/) を OpenAI 互換として登録。
      # base_url は plugins/model-providers/opencode-zen/__init__.py で
      # ハードコードされており、OPENAI_API_BASE は無視される。env 名も
      # 専用の OPENCODE_GO_API_KEY を使う(汎用 OPENAI_API_KEY ではない)。
      OPENCODE_GO_API_KEY: "${OPENCODE_API_KEY}"
      FIRECRAWL_API_KEY: "${FIRECRAWL_API_KEY}"
      # config.yaml の mcp_servers.minakata.headers が ${MCP_TOKEN} を展開
      # できるよう env として渡す。
      MCP_TOKEN: "${MCP_TOKEN}"
    depends_on:
      minakata:
        condition: service_healthy
      searxng:
        condition: service_started
    restart: unless-stopped

  # Minakata の 5 つの subagent skill を Hermes cron に登録する one-shot コンテナ。
  # hermes 本体と /opt/data (named volume hermes-data) を共有しているため、
  # ここで `hermes cron create` した job が hermes 本体のスケジューラから
  # 拾われる。idempotent なので毎回 compose up しても重複生成しない。
  hermes-cron-init:
    image: nousresearch/hermes-agent:main
    profiles: ["agent"]
    volumes:
      - hermes-data:/opt/data
      - ../hermes/config.yaml:/opt/data/config.yaml:ro
      - ../hermes/cron-bootstrap.sh:/opt/hermes-cron-bootstrap.sh:ro
    environment:
      HERMES_UID: "${HERMES_UID:-10000}"
      HERMES_GID: "${HERMES_GID:-10000}"
      OPENCODE_GO_API_KEY: "${OPENCODE_API_KEY}"
      MCP_TOKEN: "${MCP_TOKEN}"
    depends_on:
      hermes:
        condition: service_started
    # one-shot: 5 cron 登録が終わったら exit する。restart 無し。
    # image の ENTRYPOINT ["/init", "main-wrapper.sh"] はそのまま使い、
    # CMD だけ差し替えてスクリプトを s6-setuidgid hermes 経由で実行させる
    # (main-wrapper.sh が「実行可能な絶対パスならそのまま exec」する分岐に乗る)。
    restart: "no"
    command: ["/opt/hermes-cron-bootstrap.sh"]

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ../searxng:/etc/searxng
    environment:
      INSTANCE_NAME: "minakata-search"
      SEARXNG_SECRET: "${SEARXNG_SECRET}"
    # Hermes コンテナからのみ docker network 経由でアクセスする想定
    expose:
      - "8080"
    restart: unless-stopped

volumes:
  # Hermes の $HERMES_HOME = /opt/data。cron/jobs.json, sessions/, logs/,
  # memories/ などの runtime state を保持。hermes と hermes-cron-init で共有。
  hermes-data:
